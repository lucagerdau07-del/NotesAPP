[versions]
agp = "8.5.2"
kotlin = "1.9.24"
ksp = "1.9.24-1.0.20"
composeBom = "2024.06.00"
composeCompiler = "1.5.14"
coroutines = "1.8.1"
serialization = "1.6.3"
room = "2.6.1"
lifecycle = "2.8.3"
